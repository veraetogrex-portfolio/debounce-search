<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T15 Debounce Search — nine keystrokes, one request</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the component from source/, dressed in Nocturne type */
  #stage{background:radial-gradient(ellipse 65% 60% at 50% 45%,#0E1018 0%,var(--void) 72%);
    --font:var(--f-text);--mono:var(--f-mono);--display:var(--f-display)}
  #stage .db{position:absolute;left:130px;top:80px;zoom:1;z-index:1}
  .halo{position:absolute;left:50%;top:44%;width:1300px;height:700px;margin:-350px 0 0 -650px;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side,rgba(63,224,208,.07),rgba(0,0,0,0))}

</style>
</head>
<body>
<div id="stage" class="grid" data-title="T15 Debounce Search" data-url="veraetogrex-portfolio.github.io/debounce-search">
  <div class="halo"></div>
  <section class="db" id="search" aria-label="Search input with and without debounce">
    <header class="db-top">
      <h1 class="db-title">Debounce</h1>
      <p class="db-rules"><span>Search input</span><b>Same keystrokes</b><b>Wait 300 ms</b></p>
    </header>

    <div class="db-scene">
      <canvas class="db-canvas" aria-hidden="true"></canvas>
      <div class="db-row is-raw">
        <span class="db-tag">Request per key</span>
        <label class="db-field"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="db-in" placeholder="Search…" autocomplete="off" spellcheck="false" aria-label="Search"></label>
        <span class="db-note">—</span>
        <div class="db-server"><small>GET /search</small><b>0</b><em>requests</em><span class="db-load"><i></i></span></div>
      </div>
      <div class="db-row is-deb">
        <span class="db-tag">Debounced · 300 ms</span>
        <label class="db-field"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="db-mirror" placeholder="Search…" readonly tabindex="-1" aria-hidden="true"></label>
        <span class="db-note">—</span>
        <div class="db-server"><small>GET /search</small><b>0</b><em>requests</em><span class="db-load"><i></i></span></div>
      </div>
    </div>

    <div class="db-verdict" role="status">
      <p class="db-caption">Same typing. Count the requests.</p>
      <p class="db-score"><span class="r">9</span> requests<span class="a">→</span><span class="g">1</span></p>
    </div>
  </section>
  <div class="status-line"><span>Veraetogrex · T15</span><span>Search · debounce 300 ms</span></div>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const db = document.querySelector('#search').debounce;
Stage.init({
  reset: () => db.reset(),
  cursorStart: [-80, -80],                 // no cursor: the keys type themselves
  async demo(s) {
    const t0 = performance.now();
    await s.until(t0, 250);
    await s.type(db.input, 'dark mode', { cps: 13, jitter: .25 });   // 9 keys: 9 requests up top, one drop below
    await s.until(t0, 5000);
    db.clear();                            // empty box, counters back to zero = first frame
    await s.until(t0, 5700);
  },
});
</script>
</body>
</html>
